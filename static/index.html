<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sonora</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='16' r='10' fill='%23a9cf38'/%3E%3Ccircle cx='11' cy='16' r='10' fill='%23d8ff46'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css" />
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <a class="brand" href="#/all"><i></i>sonora</a>
    <nav class="nav" id="nav"></nav>
    <div class="source" id="sourceCard"></div>
  </aside>

  <header class="topbar">
    <div class="crumb" id="crumb"></div>
    <div class="top-actions">
      <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="search" placeholder="Search your library" autocomplete="off" /></label>
      <select id="tierFilter" class="filter" title="Lọc theo chất lượng">
        <option value="">All quality</option>
        <option value="lossless">Lossless / original</option>
        <option value="good">Compressed · good</option>
        <option value="low">Low / unknown</option>
      </select>
      <button class="storage" id="storagePill" title="Mở thư mục thư viện"></button>
    </div>
  </header>

  <main class="main" id="main"></main>

  <aside class="right" id="right"></aside>

  <div class="player" id="player">
    <div class="player-art" id="pArt"></div>
    <div class="player-info"><b id="pTitle">Nothing playing</b><small id="pSub">Pick a track to start</small></div>
    <button class="icon-btn" id="pFav" title="Favorite"><svg class="ic"><use href="#i-heart"/></svg></button>
    <div class="player-center">
      <div class="player-buttons">
        <button class="icon-btn" id="bShuffle" title="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" id="bPrev" title="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="big" id="bPlay" title="Play/Pause (Space)"><svg class="ic"><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="bNext" title="Next"><svg class="ic"><use href="#i-next"/></svg></button>
        <button class="icon-btn" id="bRepeat" title="Repeat"><svg class="ic"><use href="#i-repeat"/></svg><span class="one">1</span></button>
      </div>
      <div class="seek-row"><span id="tCur">0:00</span><div class="seek" id="seek"><i id="seekFill"></i></div><span id="tDur">0:00</span></div>
    </div>
    <div class="volume"><svg class="ic" id="volIcon"><use href="#i-volume"/></svg><input type="range" id="vol" min="0" max="1" step="0.01" value="0.9" /></div>
  </div>
</div>

<div class="dropveil" id="dropveil"><div><svg class="ic xl"><use href="#i-upload"/></svg><b>Thả file hoặc folder nhạc</b><span>File được copy nguyên bản vào thư viện — không convert</span></div></div>
<div class="toast" id="toast"></div>
<div class="menu" id="menu"></div>
<audio id="audio" preload="metadata"></audio>
<input type="file" id="fileInput" multiple accept="audio/*,.flac,.wav,.aiff,.aif,.opus,.m4a" hidden />
<input type="file" id="folderInput" webkitdirectory multiple hidden />

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19.5 12.6 12 20l-7.5-7.4A5 5 0 1 1 12 6.1a5 5 0 1 1 7.5 6.5Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7M17 14v7M20.5 17.5h-7"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5Z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5v14L8 12Z" fill="currentColor"/><path d="M6 5v14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5v14l10-7Z" fill="currentColor"/><path d="M18 5v14"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 4h4v4M4 20 20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="m16 9 6 6M22 9l-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20Z"/><path d="M12 10v4M12 17v.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.8-4M4 4v4h4M4 13a8 8 0 0 0 14.8 4M20 20v-4h-4"/></symbol>
  </defs>
</svg>
<script src="/static/app.js"></script>
</body>
</html>
